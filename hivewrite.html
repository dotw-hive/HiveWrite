<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveWrite — Hive Blockchain Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 30 30' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5' fill='%23e31337' opacity='0.15'/%3E%3Cpolygon points='15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5' stroke='%23e31337' stroke-width='1.5' fill='none'/%3E%3Ctext x='15' y='20' text-anchor='middle' font-family='serif' font-size='12' font-weight='600' fill='%23e31337'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --hive-red: #e31337;
    --hive-dark: #1a0a0f;
    --hive-ink: #2c1810;
    --hive-paper: #faf8f5;
    --hive-muted: #8a7060;
    --hive-border: #e2d8cc;
    --hive-accent: #c41230;
    --hive-success: #1a7a4a;
    --hive-warn: #b56a00;
    --panel-bg: #fff;
    --toolbar-bg: #f5f1ec;
    --tag-bg: #fdf0f0;
    --tag-border: #f5c0c0;
    --tag-text: #991020;
    --status-bg: #f0f5f0;
    --status-text: #1a5a3a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --hive-paper: #1a1210;
      --hive-ink: #f0ebe4;
      --hive-muted: #8a7a70;
      --hive-border: #352820;
      --panel-bg: #231710;
      --toolbar-bg: #2a1c14;
      --tag-bg: #2a0e12;
      --tag-border: #6a1020;
      --tag-text: #f09090;
      --status-bg: #0e2a18;
      --status-text: #5ab87a;
    }
  }

  html, body { height: 100%; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--hive-paper);
    color: var(--hive-ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  #app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hive-border);
    background: var(--toolbar-bg);
    flex-shrink: 0;
  }

  #app-logo { display: flex; align-items: center; gap: 10px; }
  #app-logo svg { width: 30px; height: 30px; }
  #app-logo span {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--hive-red);
    letter-spacing: -0.3px;
  }

  #keychain-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.ok  { background: #1a7a4a; }
  .status-dot.err { background: var(--hive-red); }

  #theme-toggle {
    background: transparent;
    border: 1px solid var(--hive-border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--hive-muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #theme-toggle:hover { border-color: var(--hive-red); color: var(--hive-ink); }

  body.force-light {
    --hive-paper: #faf8f5; --hive-ink: #2c1810; --hive-muted: #8a7060;
    --hive-border: #e2d8cc; --panel-bg: #fff; --toolbar-bg: #f5f1ec;
    --tag-bg: #fdf0f0; --tag-border: #f5c0c0; --tag-text: #991020;
  }
  body.force-dark {
    --hive-paper: #1a1210; --hive-ink: #f0ebe4; --hive-muted: #8a7a70;
    --hive-border: #352820; --panel-bg: #231710; --toolbar-bg: #2a1c14;
    --tag-bg: #2a0e12; --tag-border: #6a1020; --tag-text: #f09090;
  }

  /* ── Layout ── */
  #main-wrap { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  #editor-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--hive-border);
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 14px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--hive-border);
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
  }

  .tb-sep { width: 1px; height: 20px; background: var(--hive-border); margin: 0 4px; }

  .tb-btn {
    background: transparent;
    border: none;
    border-radius: 5px;
    padding: 6px 10px;
    cursor: pointer;
    color: var(--hive-ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.12s, color 0.12s;
    line-height: 1;
    min-width: 32px;
    text-align: center;
    opacity: 0.75;
  }
  .tb-btn:hover { background: var(--hive-border); color: var(--hive-ink); opacity: 1; }

  /* ── Emoji picker ── */
  #emoji-wrapper {
    position: relative;
    margin-left: 4px;
  }

  #emoji-btn {
    background: transparent;
    border: none;
    border-radius: 5px;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: background 0.12s;
    opacity: 0.75;
  }
  #emoji-btn:hover { background: var(--hive-border); opacity: 1; }

  #emoji-picker {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--panel-bg);
    border: 1px solid var(--hive-border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    z-index: 200;
    width: 320px;
  }
  #emoji-picker.open { display: block; }

  #emoji-categories {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .emoji-cat-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 7px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--hive-muted);
    transition: all 0.1s;
  }
  .emoji-cat-btn:hover,
  .emoji-cat-btn.active {
    border-color: var(--hive-border);
    color: var(--hive-ink);
    background: var(--toolbar-bg);
  }

  #emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 2px;
    max-height: 160px;
    overflow-y: auto;
  }

  .emoji-cell {
    background: transparent;
    border: none;
    border-radius: 4px;
    padding: 4px;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    text-align: center;
    transition: background 0.1s;
  }
  .emoji-cell:hover { background: var(--hive-border); }

  /* ── Write area ── */
  #editor-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 0;
  }

  #title-wrap {
    border: 1px solid var(--hive-border);
    border-radius: 9px;
    padding: 12px 16px;
    margin-bottom: 24px;
    background: var(--panel-bg);
    position: relative;
  }
  #title-wrap:focus-within { border-color: var(--hive-red); }

  #title-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--hive-muted);
    margin-bottom: 6px;
    display: block;
  }

  #title-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--hive-ink);
    line-height: 1.3;
    resize: none;
    overflow-y: auto;
    max-height: 120px;
  }
  #title-input::placeholder { color: var(--hive-muted); }

  #editor-area {
    width: 100%;
    flex: 1;
    min-height: 300px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    line-height: 1.85;
    color: var(--hive-ink);
    resize: none;
  }
  #editor-area::placeholder { color: var(--hive-muted); }

  /* ── Preview ── */
  #preview-pane {
    display: none;
    padding: 36px 44px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  #preview-title-wrap {
    border: 1px solid var(--hive-border);
    border-radius: 9px;
    padding: 12px 16px;
    margin-bottom: 24px;
    background: var(--panel-bg);
  }

  #preview-title-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--hive-muted);
    margin-bottom: 6px;
    display: block;
  }

  #preview-pane h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--hive-ink);
    line-height: 1.3;
    margin: 0;
  }
  #preview-pane h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 28px 0 12px;
    color: var(--hive-ink);
  }
  #preview-pane h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 22px 0 10px;
    color: var(--hive-ink);
  }
  #preview-pane p { margin-bottom: 16px; line-height: 1.85; }
  #preview-pane strong { font-weight: 600; }
  #preview-pane em { font-style: italic; }
  #preview-pane s { text-decoration: line-through; }
  #preview-pane code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--toolbar-bg);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--hive-border);
  }
  #preview-pane pre {
    background: var(--toolbar-bg);
    border: 1px solid var(--hive-border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  #preview-pane pre code { background: none; border: none; padding: 0; font-size: 13px; }
  #preview-pane blockquote {
    border-left: 3px solid var(--hive-red);
    padding: 4px 0 4px 18px;
    margin: 20px 0;
    font-style: italic;
    color: var(--hive-muted);
  }
  #preview-pane a { color: var(--hive-red); }
  #preview-pane hr { border: none; border-top: 1px solid var(--hive-border); margin: 28px 0; }
  #preview-pane ul, #preview-pane ol { padding-left: 26px; margin-bottom: 16px; line-height: 1.85; }
  #preview-pane li { margin-bottom: 4px; }
  #preview-pane img { max-width: 100%; border-radius: 6px; }

  /* ── Tags ── */
  #tags-row {
    padding: 10px 44px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--hive-border);
    flex-shrink: 0;
    background: var(--hive-paper);
  }

  #tags-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--hive-muted); white-space: nowrap; }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    padding: 3px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--tag-text);
  }
  .tag-pill button { background: none; border: none; cursor: pointer; color: var(--tag-text); padding: 0; font-size: 14px; line-height: 1; opacity: 0.6; }
  .tag-pill button:hover { opacity: 1; }

  #tag-input {
    border: none; background: transparent; outline: none;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--hive-ink); width: 200px;
  }
  #tag-input::placeholder { color: var(--hive-muted); }

  /* ── Sidebar ── */
  #sidebar { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel-bg); overflow-y: auto; }

  .sidebar-section { padding: 18px 20px; border-bottom: 1px solid var(--hive-border); }
  .sidebar-section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--hive-muted);
    margin-bottom: 14px;
  }

  .field-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--hive-muted); margin-bottom: 5px; }

  .field-input {
    width: 100%;
    border: 1px solid var(--hive-border);
    border-radius: 7px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--hive-paper);
    color: var(--hive-ink);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--hive-red); }

  .reward-pills { display: flex; gap: 6px; margin-bottom: 4px; }

  .reward-pill {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid var(--hive-border);
    border-radius: 7px;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    color: var(--hive-ink);
    opacity: 0.75;
    text-align: center;
    transition: all 0.12s;
    line-height: 1.3;
  }
  .reward-pill.selected {
    border-color: var(--hive-red);
    color: var(--hive-red);
    background: var(--tag-bg);
    font-weight: 500;
  }

  /* ── Publish button ── */
  #publish-btn {
    width: 100%;
    padding: 12px;
    background: var(--hive-red);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  #publish-btn:hover:not(:disabled) { background: var(--hive-accent); }
  #publish-btn:active:not(:disabled) { transform: scale(0.98); }
  #publish-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  #tx-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--hive-muted);
    display: none;
    word-break: break-all;
    line-height: 1.6;
  }
  #tx-info a { color: var(--hive-red); text-decoration: none; }
  #tx-info a:hover { text-decoration: underline; }

  /* ── Status bar ── */
  #status-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--hive-muted);
    padding: 7px 44px;
    border-top: 1px solid var(--hive-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--toolbar-bg);
    flex-shrink: 0;
  }

  #draft-controls { display: flex; align-items: center; gap: 10px; }

  #draft-indicator {
    display: none;
    color: var(--hive-success);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    border: 1px solid var(--hive-success);
    border-radius: 4px;
    padding: 2px 8px;
    transition: all 0.15s;
    background: transparent;
  }
  #draft-indicator:hover { background: var(--hive-success); color: var(--hive-paper); }

  #clear-draft-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--hive-border);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--hive-muted);
    transition: all 0.15s;
  }
  #clear-draft-btn:hover { border-color: var(--hive-red); color: var(--hive-red); }
  #clear-draft-btn.confirm {
    border-color: var(--hive-red); color: #fff;
    background: var(--hive-red); font-weight: 600;
  }
  #clear-draft-btn.confirm:hover { background: var(--hive-accent); border-color: var(--hive-accent); color: #fff; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--panel-bg);
    border: 1px solid var(--hive-border);
    border-radius: 10px;
    padding: 12px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--hive-ink);
    box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    transition: transform 0.32s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
    z-index: 9999;
    max-width: 380px;
    text-align: center;
    opacity: 0;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.success { border-color: #5ab87a; color: #1a7a4a; }
  #toast.error   { border-color: var(--hive-red); color: var(--hive-red); }

  /* ── Write/Preview toggle ── */
  .preview-toggle { display: flex; background: var(--hive-border); border-radius: 6px; padding: 2px; gap: 1px; }
  .preview-toggle button {
    border: none; background: transparent; padding: 4px 12px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer;
    color: var(--hive-muted); transition: all 0.12s;
  }
  .preview-toggle button.active { background: var(--panel-bg); color: var(--hive-ink); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hive-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--hive-muted); }

  /* ── Keychain notice ── */
  #kc-notice {
    display: none;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--tag-text);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  #kc-notice a { color: var(--hive-red); }

  /* ── Draft restore banner ── */
  #draft-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 44px;
    background: var(--tag-bg);
    border-bottom: 1px solid var(--tag-border);
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--hive-ink);
  }

  #draft-banner-text {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #draft-banner-text strong { color: var(--tag-text); font-weight: 600; }

  #draft-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }

  #draft-restore-btn, #draft-discard-btn {
    border: 1px solid var(--hive-border);
    border-radius: 6px;
    padding: 5px 14px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: transparent;
    color: var(--hive-muted);
    transition: all 0.15s;
  }
  #draft-restore-btn { border-color: var(--hive-success); color: var(--hive-success); font-weight: 600; }
  #draft-restore-btn:hover { background: var(--hive-success); color: #fff; }
  #draft-discard-btn:hover { border-color: var(--hive-red); color: var(--hive-red); }
</style>
</head>
<body>

<!-- ── Header ── -->
<div id="app-header">
  <div id="app-logo">
    <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" fill="#e31337" opacity="0.12"/>
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" stroke="#e31337" stroke-width="1.5" fill="none"/>
      <text x="15" y="20" text-anchor="middle" font-family="'Playfair Display', serif" font-size="12" font-weight="600" fill="#e31337">H</text>
    </svg>
    <span>HiveWrite</span>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark mode">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
    <div id="keychain-status">
      <div class="status-dot" id="kc-dot"></div>
      <span id="kc-label" style="color: var(--hive-muted);">checking keychain…</span>
    </div>
  </div>

<script>
(function() {

  let tags = [];
  let rewardType = 'default';
  let currentMode = 'write';
  let toastTimer  = null;
  let toastQueue  = [];
  let toastActive = false;
  let emojiOpen   = false;

  /* ── Undo / Redo ── */
  let historyStack  = [];
  let redoStack     = [];
  let historyTimer  = null;
  const HISTORY_DELAY = 800;
  let MAX_HISTORY   = 100;
  let isUndoRedo    = false;

  function snapshotState() {
    if (isUndoRedo) return;
    let ta = document.getElementById('editor-area');
    let snapshot = { value: ta.value, selStart: ta.selectionStart, selEnd: ta.selectionEnd };
    if (historyStack.length > 0 && historyStack[historyStack.length - 1].value === snapshot.value) return;
    historyStack.push(snapshot);
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function historyUndo() {
    if (historyStack.length <= 1) return;
    let ta = document.getElementById('editor-area');
    redoStack.push({ value: ta.value, selStart: ta.selectionStart, selEnd: ta.selectionEnd });
    historyStack.pop();
    let prev = historyStack[historyStack.length - 1];
    isUndoRedo = true;
    ta.value = prev.value; ta.selectionStart = prev.selStart; ta.selectionEnd = prev.selEnd;
    isUndoRedo = false;
    updateCounts(); updateHistoryButtons(); ta.focus();
  }

  function historyRedo() {
    if (redoStack.length === 0) return;
    let ta = document.getElementById('editor-area');
    let next = redoStack.pop();
    historyStack.push({ value: ta.value, selStart: ta.selectionStart, selEnd: ta.selectionEnd });
    isUndoRedo = true;
    ta.value = next.value; ta.selectionStart = next.selStart; ta.selectionEnd = next.selEnd;
    isUndoRedo = false;
    updateCounts(); updateHistoryButtons(); ta.focus();
  }

  function updateHistoryButtons() {
    const undoBtn = document.getElementById('btn-undo');
    const redoBtn = document.getElementById('btn-redo');
    if (undoBtn) undoBtn.disabled = historyStack.length <= 1;
    if (redoBtn) redoBtn.disabled = redoStack.length === 0;
  }

  /* ── Theme ── */
  let themeMode = 'auto';

  function toggleTheme() {
    let icon = document.getElementById('theme-icon');
    let label = document.getElementById('theme-label');
    let body = document.body;
    if (themeMode === 'auto' || themeMode === 'light') {
      themeMode = 'dark';
      body.classList.remove('force-light'); body.classList.add('force-dark');
      icon.textContent = '☀️'; label.textContent = 'Light';
    } else {
      themeMode = 'light';
      body.classList.remove('force-dark'); body.classList.add('force-light');
      icon.textContent = '🌙'; label.textContent = 'Dark';
    }
  }

  (function() {
    let prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let icon = document.getElementById('theme-icon');
    let label = document.getElementById('theme-label');
    if (prefersDark) { icon.textContent = '☀️'; label.textContent = 'Light'; }
    else             { icon.textContent = '🌙'; label.textContent = 'Dark'; }
  })();

  /* ── Keychain ── */
  function checkKeychain() {
    let dot = document.getElementById('kc-dot');
    let lbl = document.getElementById('kc-label');
    let btn = document.getElementById('publish-btn');
    const notice = document.getElementById('kc-notice');
    if (typeof window.hive_keychain !== 'undefined') {
      dot.className = 'status-dot ok'; lbl.textContent = 'Keychain connected';
      lbl.style.color = 'var(--hive-success)'; btn.disabled = false; notice.style.display = 'none';
    } else {
      dot.className = 'status-dot err'; lbl.textContent = 'Keychain not found';
      lbl.style.color = 'var(--hive-red)'; btn.disabled = true; notice.style.display = 'block';
    }
  }

  setTimeout(checkKeychain, 500);
  setTimeout(checkKeychain, 1500);
  setTimeout(checkKeychain, 3000);

  /* ── Write / Preview toggle ── */
  function setMode(m) {
    currentMode = m;
    let edWrap = document.getElementById('editor-wrap');
    let prev   = document.getElementById('preview-pane');
    let bw     = document.getElementById('btn-write');
    let bp     = document.getElementById('btn-preview');
    const tagsRow = document.getElementById('tags-row');
    if (m === 'write') {
      edWrap.style.display = 'flex'; prev.style.display = 'none'; tagsRow.style.display = 'flex';
      bw.className = 'active'; bw.setAttribute('aria-pressed','true');
      bp.className = '';       bp.setAttribute('aria-pressed','false');
    } else {
      edWrap.style.display = 'none'; prev.style.display = 'block'; tagsRow.style.display = 'none';
      bw.className = '';       bw.setAttribute('aria-pressed','false');
      bp.className = 'active'; bp.setAttribute('aria-pressed','true');
      renderPreview();
    }
  }

  /* ── Security helpers ── */
  function sanitizeUrl(url) {
    let decoded;
    try { decoded = decodeURIComponent(url.trim()); } catch(e) { decoded = url.trim(); }
    if (/^(https?:|ipfs:|hive:)/i.test(decoded)) return escAttr(decoded);
    return '#blocked';
  }

  function escAttr(str) {
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;')
              .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Markdown parser ── */
  function markdownToHtml(raw) {
    let s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    s = s.replace(/```([a-z0-9-]*)\n([\s\S]*?)```/g, function(_, lang, code) {
      let safeLang = lang.replace(/[^a-z0-9-]/gi, '').substring(0, 32);
      return '<pre><code' + (safeLang ? ' class="language-' + safeLang + '"' : '') + '>' + code + '</code></pre>';
    });

    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');
    s = s.replace(/~~(.+?)~~/g,         '<s>$1</s>');

    s = s.replace(/((?:^&gt; .*$\n?)+)/gm, function(block) {
      let lines = block.trim().split('\n');
      let inner = lines.map(function(l) { return l.replace(/^&gt;\s?/, ''); }).join('<br>');
      return '<blockquote>' + inner + '</blockquote>\n';
    });

    s = s.replace(/^---$/gm, '<hr>');

    s = s.replace(/((?:^- .+$\n?)+)/gm, function(block) {
      let items = block.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^- /, '') + '</li>'; }).join('');
      return '<ul>' + items + '</ul>\n';
    });

    s = s.replace(/((?:^\d+\. .+$\n?)+)/gm, function(block) {
      let items = block.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^\d+\. /, '') + '</li>'; }).join('');
      return '<ol>' + items + '</ol>\n';
    });

    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, url) {
      return '<img src="' + sanitizeUrl(url) + '" alt="' + escAttr(alt) + '">';
    });

    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url) {
      return '<a href="' + sanitizeUrl(url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
    });

    let lines = s.split('\n');
    let out = [];
    let inPara = false;
    const blockTags = /^<(h[1-6]|ul|ol|li|blockquote|pre|hr|img)/;
    lines.forEach(function(line) {
      if (blockTags.test(line) || line.trim() === '') {
        if (inPara) { out.push('</p>'); inPara = false; }
        if (line.trim() !== '') out.push(line);
      } else {
        if (!inPara) { out.push('<p>'); inPara = true; }
        out.push(line);
      }
    });
    if (inPara) out.push('</p>');
    return out.join('\n');
  }

  function renderPreview() {
    let titleVal = document.getElementById('title-input').value || '';
    let body     = document.getElementById('editor-area').value || '';
    let titleHtml = titleVal
      ? '<div id="preview-title-wrap"><span id="preview-title-label">Post Title</span><h1>' +
        titleVal.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</h1></div>'
      : '<div id="preview-title-wrap"><span id="preview-title-label">Post Title</span><h1 style="color:var(--hive-muted);font-style:italic;">Untitled</h1></div>';
    document.getElementById('preview-pane').innerHTML = titleHtml + markdownToHtml(body);
  }

  /* ── Toolbar helpers ── */
  function getTA() { return document.getElementById('editor-area'); }

  function wrap(pre, post) {
    snapshotNow();
    const ta = getTA();
    let s = ta.selectionStart, e = ta.selectionEnd;
    let sel = ta.value.substring(s, e) || 'text';
    ta.value = ta.value.substring(0,s) + pre + sel + post + ta.value.substring(e);
    ta.focus(); ta.selectionStart = s + pre.length; ta.selectionEnd = s + pre.length + sel.length;
    updateCounts(); snapshotNow();
  }

  function insertLine(prefix) {
    snapshotNow();
    let ta = getTA();
    let pos = ta.selectionStart;
    let before = ta.value.substring(0, pos);
    let after  = ta.value.substring(pos);
    let nl = (before.length > 0 && !before.endsWith('\n')) ? '\n' : '';
    ta.value = before + nl + prefix + after;
    let np = pos + nl.length + prefix.length;
    ta.focus(); ta.selectionStart = ta.selectionEnd = np;
    updateCounts(); snapshotNow();
  }

  function insertLink() {
    let ta = getTA();
    let s = ta.selectionStart, e = ta.selectionEnd;
    let sel = ta.value.substring(s, e) || 'link text';
    let ins = '[' + sel + '](https://)';
    ta.value = ta.value.substring(0,s) + ins + ta.value.substring(e);
    ta.focus(); ta.selectionStart = s + sel.length + 3; ta.selectionEnd = s + ins.length - 1;
    updateCounts();
  }

  function insertImage() {
    let url = prompt('Image URL:'); if (!url) return;
    let alt = prompt('Alt text (optional):') || '';
    insertLine('!['+ alt +'](' + url + ')\n');
  }

  function insertCodeBlock() {
    let ta = getTA();
    let s = ta.selectionStart, e = ta.selectionEnd;
    let sel = ta.value.substring(s, e) || '';
    let ins = '```\n' + sel + '\n```';
    ta.value = ta.value.substring(0,s) + ins + ta.value.substring(e);
    ta.focus(); ta.selectionStart = s + 4; ta.selectionEnd = s + 4 + sel.length;
    updateCounts();
  }

  document.getElementById('editor-area').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); historyUndo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); historyRedo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); wrap('**','**'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); wrap('*','*'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); insertLink(); }
  });

  snapshotState();

  /* ── Emoji picker ── */
  const EMOJI_CATS = [
    { label:'Smileys', emojis:['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤔','😐','😑','😶','😏','😒','🙄','😬','😌','😔','😪','😷','🤒','🤕','🥴','😵','🤯','🤠','🥳','😎','🤓','😕','😟','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😩','😫','😤','😡','😠','🤬','😈','👿','💀','☠️'] },
    { label:'People',  emojis:['👋','🤚','🖐','✋','🖖','👌','✌️','🤞','🤟','🤘','👍','👎','✊','👊','👏','🙌','🙏','💪','👀','👅','👄','💋','🧠','👶','🧒','👦','👧','🧑','👱','👨','🧔','👩','🧓','👴','👵','🙍','🙎','🙅','🙆','💁','🙋','🧏','🙇','🤦','🤷','👮','🕵️','💂','🥷','👷','🤴','👸','👳','👲','🧕','🤵','👰','🤰','🤱','👼','🎅','🤶','🧙','🧝','🧛','🧟','🧞','🧜','🧚','👫','👬','👭','💏','💑','👨‍👩‍👦','👨‍👩‍👧'] },
    { label:'Nature',  emojis:['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅','🦉','🦇','🐺','🐴','🦄','🐝','🦋','🐌','🐞','🐜','🦗','🐢','🐍','🦎','🦖','🦕','🐙','🦑','🐬','🐳','🐋','🦈','🌸','🌺','🌹','🌷','🌱','🌲','🌳','🌴','🍀','🍁','🍂','🍃','🌿','🍄','🌾','💐','🌻','🌞','⭐','🌟','💫','✨','⚡','🔥','💥','❄️','🌊','🌈','☀️','🌤','⛅','🌧','⛈','🌨'] },

    { label:'Travel',  emojis:['🚀','✈️','🚂','🚗','🚕','🚙','🚌','🚎','🏎','🏍','🛵','🚲','🛴','⚓','⛵','🚤','🛥','🚢','🛩','🛫','🛬','🪂','🚁','🛸','🌍','🌎','🌏','🗺','🧭','🏔','⛰','🌋','🏕','🏖','🏜','🏝','🏞','🏟','🏛','🏗','🏘','🏠','🏡','🏢','🏣','🏤','🏥','🏦','🏨','🏩','🏪','🏫','🏬','🏭','🏯','🏰','💒','🗼','🗽','⛪','🕌','⛩','🕋','⛲','⛺','🌁','🌃','🏙','🌄','🌅','🌆','🌇','🌉','🎠','🎡','🎢','💈','🎪'] },
    { label:'Symbols', emojis:['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💯','🔥','✅','❌','⭕','🛑','⛔','📛','🚫','💢','♨️','🔞','📵','❗','❕','❓','❔','‼️','⁉️','♻️','✔️','🆗','🆕','🆒','🆓','🆙','🔝','🔚','🔙','🔛','🔜','▶️','⏸','⏹','⏺','⏭','⏮','⏩','⏪','🔀','🔁','🔂','➕','➖','➗','✖️','💲','💱','™️','©️','®️','🎵','🎶','🔔','🔕','🔇','📢','📣','💬','💭','🗯','💤','🔅','🔆','📶','🔱','⚜️','🔰'] }
  ];

  function buildEmojiPicker() {
    let catEl = document.getElementById('emoji-categories');
    EMOJI_CATS.forEach(function(cat, i) {
      let btn = document.createElement('button');
      btn.className = 'emoji-cat-btn' + (i === 0 ? ' active' : '');
      btn.textContent = cat.label;
      btn.onclick = function() {
        document.querySelectorAll('.emoji-cat-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderEmojiGrid(i);
      };
      catEl.appendChild(btn);
    });
    renderEmojiGrid(0);
  }

  function renderEmojiGrid(idx) {
    let grid = document.getElementById('emoji-grid');
    grid.innerHTML = '';
    EMOJI_CATS[idx].emojis.forEach(function(emoji) {
      let btn = document.createElement('button');
      btn.className = 'emoji-cell'; btn.textContent = emoji; btn.title = emoji;
      btn.onclick = function() { insertEmoji(emoji); };
      grid.appendChild(btn);
    });
  }

  function toggleEmojiPicker() {
    emojiOpen = !emojiOpen;
    document.getElementById('emoji-picker').classList.toggle('open', emojiOpen);
    document.getElementById('emoji-btn').setAttribute('aria-expanded', emojiOpen);
  }

  function insertEmoji(emoji) {
    let ta = getTA(), pos = ta.selectionStart;
    ta.value = ta.value.substring(0, pos) + emoji + ta.value.substring(pos);
    ta.focus(); ta.selectionStart = ta.selectionEnd = pos + emoji.length;
    updateCounts();
    scheduleDraftSave();
    /* Close picker after insertion */
    emojiOpen = false;
    document.getElementById('emoji-picker').classList.remove('open');
    document.getElementById('emoji-btn').setAttribute('aria-expanded', 'false');
  }

  /* Close picker on outside click */
  document.addEventListener('click', function(e) {
    if (emojiOpen && !document.getElementById('emoji-wrapper').contains(e.target)) {
      emojiOpen = false;
      document.getElementById('emoji-picker').classList.remove('open');
      document.getElementById('emoji-btn').setAttribute('aria-expanded', 'false');
    }
  });

  buildEmojiPicker();

  /* ── Reward selector ── */
  function selectReward(el) {
    document.querySelectorAll('.reward-pill').forEach(function(b) {
      b.className = 'reward-pill'; b.setAttribute('aria-pressed','false');
    });
    el.className = 'reward-pill selected'; el.setAttribute('aria-pressed','true');
    rewardType = el.getAttribute('data-val');
    scheduleDraftSave();
  }

  /* ── Tag manager ── */
  const tagInput = document.getElementById('tag-input');

  tagInput.addEventListener('keydown', function(e) {
    if ((e.key === 'Enter' || e.key === ',' || e.key === ' ') && this.value.trim()) {
      e.preventDefault();
      let segments = this.value.split(/[,\s]+/);
      segments.forEach(function(seg) {
        let t = seg.trim().toLowerCase().replace(/\s+/g, '-');
        if (t) addTag(t);
      });
      this.value = '';
    } else if (e.key === 'Backspace' && this.value === '' && tags.length > 0) {
      removeTag(tags.length - 1);
    }
  });

  function addTag(t) {
    t = t.replace(/[^a-z0-9-]/g,'');
    if (!t || tags.includes(t)) return;
    if (tags.length >= 8) { toast('Maximum 8 tags', 'error'); return; }
    tags.push(t); renderTags();
    scheduleDraftSave();
  }

  function removeTag(i) { tags.splice(i, 1); renderTags(); scheduleDraftSave(); }

  function renderTags() {
    let c = document.getElementById('tags-container');
    c.innerHTML = '';
    tags.forEach(function(t, i) {
      let pill = document.createElement('span');
      pill.className = 'tag-pill'; pill.setAttribute('role','listitem');
      pill.innerHTML = '#' + t + '<button onclick="removeTag(' + i + ')" aria-label="Remove tag ' + t + '">×</button>';
      c.appendChild(pill);
    });
  }

  /* ── Word / char counts ── */
  function updateCounts() {
    let body = document.getElementById('editor-area').value;
    let words = body.trim() === '' ? 0 : body.trim().split(/\s+/).length;
    document.getElementById('word-count').textContent = words + ' words';
    document.getElementById('char-count').textContent = body.length + ' chars';
  }

  document.getElementById('editor-area').addEventListener('input', function() {
    updateCounts();
    clearTimeout(historyTimer);
    historyTimer = setTimeout(snapshotState, HISTORY_DELAY);
  });

  function snapshotNow() { clearTimeout(historyTimer); snapshotState(); }

  document.getElementById('title-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  });

  /* ── Toast ── */
  function toast(msg, type) {
    toastQueue.push({ msg: msg, type: type || '' });
    if (!toastActive) processToastQueue();
  }

  function processToastQueue() {
    if (toastQueue.length === 0) { toastActive = false; return; }
    toastActive = true;
    let item = toastQueue.shift();
    let t = document.getElementById('toast');
    t.textContent = item.msg; t.className = 'show ' + item.type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      t.className = '';
      setTimeout(processToastQueue, 350);
    }, 3500);
  }

  /* ── Slugify ── */
  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-')
      .replace(/-+/g, '-').substring(0, 255);
  }

  /* ── Publish ── */
  function publish() {
    checkKeychain();
    let username    = document.getElementById('username').value.trim().replace(/^@/, '');
    let title       = document.getElementById('title-input').value.trim();
    let body        = document.getElementById('editor-area').value.trim();
    let community   = document.getElementById('community').value;
    let beneficiary = document.getElementById('beneficiary').value.trim();

    let pendingTag = document.getElementById('tag-input').value.trim();
    if (pendingTag) {
      addTag(pendingTag.replace(/,+/g,'').toLowerCase().replace(/\s+/g,'-'));
      document.getElementById('tag-input').value = '';
    }

    if (!username)          { toast('Enter your Hive username', 'error'); return; }
    if (!title)             { toast('Add a title before publishing', 'error'); return; }
    if (body.length < 10)   { toast('Post body is too short', 'error'); return; }
    if (tags.length === 0)  { toast('Add at least one tag', 'error'); return; }
    if (tags.length > 8)    { toast('Maximum 8 tags allowed', 'error'); return; }
    if (typeof window.hive_keychain === 'undefined') { toast('Hive Keychain extension not found', 'error'); return; }

    let permlink       = slugify(title) + '-' + Date.now().toString(36);
    let parentAuthor   = '';
    let parentPermlink = community ? community : tags[0];
    let jsonMeta       = JSON.stringify({ tags: tags, app: 'hivewrite/1.0', format: 'markdown' });

    const selectedPill = document.querySelector('.reward-pill.selected');
    rewardType = selectedPill ? selectedPill.getAttribute('data-val') : 'default';

    let percentHbd = 5000;
    if (rewardType === 'sp')      percentHbd = 0;
    if (rewardType === 'decline') percentHbd = 10000;
    if (rewardType === 'burn')    percentHbd = 5000;

    let maxPayout = rewardType === 'decline' ? '0.000 HBD' : '1000000.000 HBD';
    let commentOptions = null;
    let beneficiaryList = [];

    if (beneficiary) {
      let entries = beneficiary.split(',');
      for (let i = 0; i < entries.length; i++) {
        let entry = entries[i].trim();
        if (!entry) continue;
        let parts = entry.split(':');
        if (parts.length !== 2) {
          toast('Beneficiary format: account:percent  e.g. alice:10, james:10', 'error'); return;
        }
        let acc = parts[0].trim().replace(/^@/, '');
        let pct = Math.round(parseFloat(parts[1]) * 100);
        if (!acc)                    { toast('Beneficiary account name is missing', 'error'); return; }
        if (isNaN(pct) || pct <= 0)  { toast('Beneficiary percentage must be greater than 0 (' + acc + ')', 'error'); return; }
        if (pct > 10000)             { toast('Beneficiary percentage cannot exceed 100% (' + acc + ')', 'error'); return; }
        beneficiaryList.push({ account: acc, weight: pct });
      }

      let seen = {};
      for (let i = 0; i < beneficiaryList.length; i++) {
        let acc = beneficiaryList[i].account;
        if (seen[acc]) { toast('Duplicate beneficiary: ' + acc, 'error'); return; }
        seen[acc] = true;
      }

      if (beneficiaryList.length > 8) { toast('Maximum 8 beneficiaries allowed', 'error'); return; }

      let totalPct = beneficiaryList.reduce(function(sum, b) { return sum + b.weight; }, 0);
      if (totalPct > 10000) {
        toast('Beneficiary percentages add up to ' + (totalPct / 100) + '% — must not exceed 100%', 'error');
        return;
      }

      if (rewardType === 'decline') {
        toast('Rewards declined — beneficiaries will receive nothing', 'error');
      }
    }

    if (rewardType === 'burn') {
      beneficiaryList = [{ account: 'null', weight: 10000 }];
    }

    beneficiaryList.sort(function(a, b) { return a.account.localeCompare(b.account); });

    if (rewardType !== 'default' || beneficiaryList.length > 0) {
      commentOptions = {
        author: username, permlink: permlink,
        max_accepted_payout: maxPayout, percent_hbd: percentHbd,
        allow_votes: true, allow_curation_rewards: true,
        extensions: beneficiaryList.length > 0 ? [[0, { beneficiaries: beneficiaryList }]] : []
      };
    }

    let operations = [['comment', {
      parent_author: parentAuthor, parent_permlink: parentPermlink,
      author: username, permlink: permlink, title: title, body: body, json_metadata: jsonMeta
    }]];

    if (commentOptions) operations.push(['comment_options', commentOptions]);

    let btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Signing…';

    let broadcastTimeout = setTimeout(function() {
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Publish to Hive';
      toast('Request timed out — Keychain did not respond. Please try again.', 'error');
    }, 35000);

    window.hive_keychain.requestBroadcast(username, operations, 'posting', function(response) {
      clearTimeout(broadcastTimeout);
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Publish to Hive';

      if (response.success) {
        let txId = (response.result && response.result.id) ? response.result.id : '';
        let txInfo = document.getElementById('tx-info');
        let txIdEl = document.getElementById('tx-id');
        let txLink = document.getElementById('tx-link');
        if (txId) {
          txIdEl.textContent = txId.substring(0,20) + '…';
          txLink.href = 'https://hivehub.dev/tx/' + txId;
        }
        txInfo.style.display = 'block';
        toast('✓ Published!  @' + username + '/' + permlink, 'success');
      } else {
        let errMsg = response.message || response.error || 'Transaction rejected';
        toast('Error: ' + errMsg, 'error');
        console.error('[HiveWrite] Broadcast error:', response);
      }
    });
  }

  /* ── Autosave — localStorage ── */
  const DRAFT_KEY   = 'hivewrite_draft';
  let   draftTimer  = null;
  const DRAFT_DELAY = 1500;

  function collectDraft() {
    const selectedPill = document.querySelector('.reward-pill.selected');
    return {
      title:       document.getElementById('title-input').value,
      body:        document.getElementById('editor-area').value,
      tags:        tags.slice(),
      username:    document.getElementById('username').value,
      community:   document.getElementById('community').value,
      beneficiary: document.getElementById('beneficiary').value,
      rewardType:  selectedPill ? selectedPill.getAttribute('data-val') : 'default'
    };
  }

  function saveDraft() {
    let draft = collectDraft();
    if (!draft.title && !draft.body && draft.tags.length === 0) return;
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      showDraftIndicator();
    } catch(e) {
      console.warn('[HiveWrite] Draft save failed:', e);
    }
  }

  function saveDraftNow() { clearTimeout(draftTimer); saveDraft(); }

  function showDraftIndicator() {
    document.getElementById('draft-indicator').style.display = 'inline';
    document.getElementById('clear-draft-btn').style.display = 'inline';
  }

  function hideDraftIndicator() {
    document.getElementById('draft-indicator').style.display = 'none';
    document.getElementById('clear-draft-btn').style.display = 'none';
  }

  function scheduleDraftSave() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, DRAFT_DELAY);
  }

  let clearDraftPending = false;
  let clearDraftResetTimer = null;

  function clearDraft() {
    let btn = document.getElementById('clear-draft-btn');
    if (!clearDraftPending) {
      clearDraftPending = true;
      btn.textContent = 'Are you sure?';
      btn.classList.add('confirm');
      clearTimeout(clearDraftResetTimer);
      clearDraftResetTimer = setTimeout(function() {
        clearDraftPending = false;
        btn.textContent = '× Clear draft';
        btn.classList.remove('confirm');
      }, 3000);
      return;
    }
    clearTimeout(clearDraftResetTimer);
    clearDraftPending = false;
    btn.textContent = '× Clear draft';
    btn.classList.remove('confirm');
    try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
    document.getElementById('title-input').value = '';
    document.getElementById('editor-area').value = '';
    document.getElementById('title-input').style.height = 'auto';
    tags = []; renderTags(); updateCounts(); hideDraftIndicator();
    historyStack = []; redoStack = []; snapshotState(); updateHistoryButtons();
    toast('Draft cleared', '');
  }

  function buildDraftPreview(draft) {
    if (draft.title && draft.title.trim()) return draft.title.trim().substring(0, 80);
    if (draft.body && draft.body.trim()) {
      let p = draft.body.trim().replace(/\s+/g, ' ').substring(0, 80);
      return p + (draft.body.trim().length > 80 ? '…' : '');
    }
    return '(untitled draft)';
  }

  function checkForDraft() {
    let raw; try { raw = localStorage.getItem(DRAFT_KEY); } catch(e) { return; }
    if (!raw) return;
    let draft; try { draft = JSON.parse(raw); } catch(e) { return; }
    document.getElementById('draft-banner-preview').textContent = buildDraftPreview(draft);
    document.getElementById('draft-banner').style.display = 'flex';
  }

  function restoreDraft() {
    let raw; try { raw = localStorage.getItem(DRAFT_KEY); } catch(e) { return; }
    if (!raw) return;
    let draft; try { draft = JSON.parse(raw); } catch(e) { return; }
    if (draft.title) {
      let ti = document.getElementById('title-input');
      ti.value = draft.title; ti.style.height = 'auto'; ti.style.height = ti.scrollHeight + 'px';
    }
    if (draft.body)        document.getElementById('editor-area').value   = draft.body;
    if (draft.tags && draft.tags.length > 0) { tags = []; draft.tags.forEach(function(t) { addTag(t); }); }
    if (draft.username)    document.getElementById('username').value       = draft.username;
    if (draft.community)   document.getElementById('community').value      = draft.community;
    if (draft.beneficiary) document.getElementById('beneficiary').value    = draft.beneficiary;
    if (draft.rewardType) {
      let pill = document.querySelector('.reward-pill[data-val="' + draft.rewardType + '"]');
      if (pill) selectReward(pill);
    }
    updateCounts(); snapshotState(); showDraftIndicator();
    document.getElementById('draft-banner').style.display = 'none';
    toast('Draft restored', 'success');
  }

  function discardDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
    document.getElementById('draft-banner').style.display = 'none';
    toast('Draft discarded', '');
  }

  document.getElementById('title-input').addEventListener('input',   scheduleDraftSave);
  document.getElementById('editor-area').addEventListener('input',   scheduleDraftSave);
  document.getElementById('username').addEventListener('input',      scheduleDraftSave);
  document.getElementById('community').addEventListener('input',     scheduleDraftSave);
  document.getElementById('beneficiary').addEventListener('input',   scheduleDraftSave);

  checkForDraft();

  window.wrap              = wrap;
  window.insertLine        = insertLine;
  window.insertLink        = insertLink;
  window.insertImage       = insertImage;
  window.insertCodeBlock   = insertCodeBlock;
  window.setMode           = setMode;
  window.selectReward      = selectReward;
  window.removeTag         = removeTag;
  window.publish           = publish;
  window.historyUndo       = historyUndo;
  window.historyRedo       = historyRedo;
  window.toggleTheme       = toggleTheme;
  window.saveDraftNow      = saveDraftNow;
  window.clearDraft        = clearDraft;
  window.restoreDraft      = restoreDraft;
  window.discardDraft      = discardDraft;
  window.toggleEmojiPicker = toggleEmojiPicker;

})();
</script>
