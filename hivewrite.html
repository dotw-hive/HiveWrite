<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveWrite — Hive Blockchain Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --hive-red: #e31337;
    --hive-dark: #1a0a0f;
    --hive-ink: #2c1810;
    --hive-paper: #faf8f5;
    --hive-muted: #8a7060;
    --hive-border: #e2d8cc;
    --hive-accent: #c41230;
    --hive-success: #1a7a4a;
    --hive-warn: #b56a00;
    --panel-bg: #fff;
    --toolbar-bg: #f5f1ec;
    --tag-bg: #fdf0f0;
    --tag-border: #f5c0c0;
    --tag-text: #991020;
    --status-bg: #f0f5f0;
    --status-text: #1a5a3a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --hive-paper: #1a1210;
      --hive-ink: #f0ebe4;
      --hive-muted: #8a7a70;
      --hive-border: #352820;
      --panel-bg: #231710;
      --toolbar-bg: #2a1c14;
      --tag-bg: #2a0e12;
      --tag-border: #6a1020;
      --tag-text: #f09090;
      --status-bg: #0e2a18;
      --status-text: #5ab87a;
    }
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--hive-paper);
    color: var(--hive-ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  #app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hive-border);
    background: var(--toolbar-bg);
    flex-shrink: 0;
  }

  #app-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #app-logo svg { width: 30px; height: 30px; }

  #app-logo span {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--hive-red);
    letter-spacing: -0.3px;
  }

  #keychain-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.ok  { background: #1a7a4a; }
  .status-dot.err { background: var(--hive-red); }

  /* ── Layout ── */
  #main-wrap {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  #editor-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--hive-border);
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 14px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--hive-border);
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tb-sep {
    width: 1px; height: 20px;
    background: var(--hive-border);
    margin: 0 4px;
  }

  .tb-btn {
    background: transparent;
    border: none;
    border-radius: 5px;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--hive-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.12s, color 0.12s;
    line-height: 1;
    min-width: 28px;
    text-align: center;
  }
  .tb-btn:hover {
    background: var(--hive-border);
    color: var(--hive-ink);
  }

  /* ── Write area ── */
  #editor-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 0;
  }

  #title-wrap {
    border: 1px solid var(--hive-border);
    border-radius: 9px;
    padding: 12px 16px;
    margin-bottom: 24px;
    background: var(--panel-bg);
    position: relative;
  }

  #title-wrap:focus-within {
    border-color: var(--hive-red);
  }

  #title-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--hive-muted);
    margin-bottom: 6px;
    display: block;
  }

  #title-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--hive-ink);
    line-height: 1.3;
    resize: none;
    overflow: hidden;
  }
  #title-input::placeholder { color: var(--hive-muted); }

  #editor-area {
    width: 100%;
    flex: 1;
    min-height: 300px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    line-height: 1.85;
    color: var(--hive-ink);
    resize: none;
  }
  #editor-area::placeholder { color: var(--hive-muted); }

  /* ── Preview ── */
  #preview-pane {
    display: none;
    padding: 36px 44px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  #preview-pane h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--hive-ink);
    line-height: 1.3;
  }
  #preview-pane h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 28px 0 12px;
    color: var(--hive-ink);
  }
  #preview-pane h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 22px 0 10px;
    color: var(--hive-ink);
  }
  #preview-pane p { margin-bottom: 16px; line-height: 1.85; }
  #preview-pane strong { font-weight: 600; }
  #preview-pane em { font-style: italic; }
  #preview-pane s { text-decoration: line-through; }
  #preview-pane code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--toolbar-bg);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--hive-border);
  }
  #preview-pane pre {
    background: var(--toolbar-bg);
    border: 1px solid var(--hive-border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  #preview-pane pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
  }
  #preview-pane blockquote {
    border-left: 3px solid var(--hive-red);
    padding: 4px 0 4px 18px;
    margin: 20px 0;
    font-style: italic;
    color: var(--hive-muted);
  }
  #preview-pane a { color: var(--hive-red); }
  #preview-pane hr {
    border: none;
    border-top: 1px solid var(--hive-border);
    margin: 28px 0;
  }
  #preview-pane ul, #preview-pane ol {
    padding-left: 26px;
    margin-bottom: 16px;
    line-height: 1.85;
  }
  #preview-pane li { margin-bottom: 4px; }
  #preview-pane img { max-width: 100%; border-radius: 6px; }

  /* ── Tags ── */
  #tags-row {
    padding: 10px 44px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--hive-border);
    flex-shrink: 0;
    background: var(--hive-paper);
  }

  #tags-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--hive-muted);
    white-space: nowrap;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    padding: 3px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--tag-text);
  }

  .tag-pill button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--tag-text);
    padding: 0;
    font-size: 14px;
    line-height: 1;
    opacity: 0.6;
  }
  .tag-pill button:hover { opacity: 1; }

  #tag-input {
    border: none;
    background: transparent;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--hive-ink);
    width: 140px;
  }
  #tag-input::placeholder { color: var(--hive-muted); }

  /* ── Sidebar ── */
  #sidebar {
    width: 290px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 18px 20px;
    border-bottom: 1px solid var(--hive-border);
  }

  .sidebar-section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--hive-muted);
    margin-bottom: 14px;
  }

  .field-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--hive-muted);
    margin-bottom: 5px;
  }

  .field-input {
    width: 100%;
    border: 1px solid var(--hive-border);
    border-radius: 7px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--hive-paper);
    color: var(--hive-ink);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--hive-red); }

  .field-select {
    width: 100%;
    border: 1px solid var(--hive-border);
    border-radius: 7px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--hive-paper);
    color: var(--hive-ink);
    outline: none;
    margin-bottom: 12px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  .reward-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
  }

  .reward-pill {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid var(--hive-border);
    border-radius: 7px;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    color: var(--hive-muted);
    text-align: center;
    transition: all 0.12s;
    line-height: 1.3;
  }
  .reward-pill.selected {
    border-color: var(--hive-red);
    color: var(--hive-red);
    background: var(--tag-bg);
    font-weight: 500;
  }

  /* ── Publish button ── */
  #publish-btn {
    width: 100%;
    padding: 12px;
    background: var(--hive-red);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  #publish-btn:hover:not(:disabled) { background: var(--hive-accent); }
  #publish-btn:active:not(:disabled) { transform: scale(0.98); }
  #publish-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  #tx-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--hive-muted);
    display: none;
    word-break: break-all;
    line-height: 1.6;
  }

  #tx-info a {
    color: var(--hive-red);
    text-decoration: none;
  }
  #tx-info a:hover { text-decoration: underline; }

  /* ── Status bar ── */
  #status-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--hive-muted);
    padding: 7px 44px;
    border-top: 1px solid var(--hive-border);
    display: flex;
    justify-content: space-between;
    background: var(--toolbar-bg);
    flex-shrink: 0;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--panel-bg);
    border: 1px solid var(--hive-border);
    border-radius: 10px;
    padding: 12px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--hive-ink);
    box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    transition: transform 0.32s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
    z-index: 9999;
    max-width: 380px;
    text-align: center;
    opacity: 0;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #toast.success { border-color: #5ab87a; color: #1a7a4a; }
  #toast.error   { border-color: var(--hive-red); color: var(--hive-red); }

  /* ── Write/Preview toggle ── */
  .preview-toggle {
    display: flex;
    background: var(--hive-border);
    border-radius: 6px;
    padding: 2px;
    gap: 1px;
  }
  .preview-toggle button {
    border: none;
    background: transparent;
    padding: 4px 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    color: var(--hive-muted);
    transition: all 0.12s;
  }
  .preview-toggle button.active {
    background: var(--panel-bg);
    color: var(--hive-ink);
  }

  /* ── Scrollbar styling ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hive-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--hive-muted); }

  /* ── Keychain missing notice ── */
  #kc-notice {
    display: none;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--tag-text);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  #kc-notice a { color: var(--hive-red); }
</style>
</head>
<body>

<!-- ── Header ── -->
<div id="app-header">
  <div id="app-logo">
    <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" fill="#e31337" opacity="0.12"/>
      <polygon points="15,2 28,8.5 28,21.5 15,28 2,21.5 2,8.5" stroke="#e31337" stroke-width="1.5" fill="none"/>
      <text x="15" y="20" text-anchor="middle" font-family="'Playfair Display', serif" font-size="12" font-weight="600" fill="#e31337">H</text>
    </svg>
    <span>HiveWrite</span>
  </div>
  <div id="keychain-status">
    <div class="status-dot" id="kc-dot"></div>
    <span id="kc-label" style="color: var(--hive-muted);">checking keychain…</span>
  </div>
</div>

<!-- ── Main ── -->
<div id="main-wrap">

  <!-- Editor column -->
  <div id="editor-col">

    <!-- Toolbar -->
    <div id="toolbar" role="toolbar" aria-label="Markdown formatting">
      <div class="preview-toggle">
        <button class="active" id="btn-write" onclick="setMode('write')" aria-pressed="true">Write</button>
        <button id="btn-preview" onclick="setMode('preview')" aria-pressed="false">Preview</button>
      </div>
      <div class="tb-sep" role="separator"></div>
      <button class="tb-btn" onclick="wrap('**','**')" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tb-btn" onclick="wrap('*','*')" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tb-btn" onclick="wrap('~~','~~')" title="Strikethrough"><s>S</s></button>
      <div class="tb-sep" role="separator"></div>
      <button class="tb-btn" onclick="insertLine('# ')"  title="Heading 1">H1</button>
      <button class="tb-btn" onclick="insertLine('## ')" title="Heading 2">H2</button>
      <button class="tb-btn" onclick="insertLine('### ')" title="Heading 3">H3</button>
      <div class="tb-sep" role="separator"></div>
      <button class="tb-btn" onclick="insertLine('> ')" title="Blockquote">❝</button>
      <button class="tb-btn" onclick="insertLine('- ')" title="Bullet list">•—</button>
      <button class="tb-btn" onclick="insertLine('1. ')" title="Numbered list">1.</button>
      <div class="tb-sep" role="separator"></div>
      <button class="tb-btn" onclick="insertLink()" title="Link">🔗</button>
      <button class="tb-btn" onclick="insertImage()" title="Image">🖼</button>
      <button class="tb-btn" onclick="insertCodeBlock()" title="Code block">&lt;/&gt;</button>
      <button class="tb-btn" onclick="insertLine('---\n')" title="Horizontal rule">—</button>
    </div>

    <!-- Write pane -->
    <div id="editor-wrap">
      <div id="title-wrap">
        <span id="title-label">Post Title</span>
        <textarea id="title-input" placeholder="Enter your post title…" rows="1" aria-label="Post title" spellcheck="true"></textarea>
      </div>
      <textarea id="editor-area" placeholder="Write your post in Markdown…&#10;&#10;Use the toolbar above or type Markdown directly." aria-label="Post body" spellcheck="true"></textarea>
    </div>

    <!-- Preview pane -->
    <div id="preview-pane" aria-label="Markdown preview" role="region"></div>

    <!-- Tags row -->
    <div id="tags-row">
      <span id="tags-label">Tags:</span>
      <div id="tags-container" role="list" aria-label="Post tags"></div>
      <input id="tag-input" placeholder="tag1, tag2 or press Enter" maxlength="24" aria-label="Add tag" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

  </div><!-- /editor-col -->

  <!-- Sidebar -->
  <div id="sidebar" role="complementary" aria-label="Post settings">

    <div class="sidebar-section">
      <h3>Account</h3>
      <div class="field-label">Hive username</div>
      <input class="field-input" id="username" placeholder="yourusername" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Hive username">
    </div>

    <div class="sidebar-section">
      <h3>Post Settings</h3>

      <div class="field-label">Community / blog</div>
      <select class="field-select" id="community" aria-label="Community">
        <option value="">My blog</option>
        <option value="hive-194913">LeoFinance</option>
        <option value="hive-167922">Natural Medicine</option>
        <option value="hive-196037">HivePH</option>
        <option value="hive-110490">Blockchain Poet</option>
        <option value="hive-101145">Hive Gaming</option>
        <option value="hive-174578">OCD</option>
        <option value="hive-120586">Photography Lovers</option>
        <option value="hive-140217">Hive Food</option>
        <option value="hive-163772">Music</option>
      </select>

      <div class="field-label">Beneficiary (optional)</div>
      <input class="field-input" id="beneficiary" placeholder="account:percent  e.g. alice:25" autocomplete="off" aria-label="Beneficiary">

      <div class="field-label">Rewards</div>
      <div class="reward-pills" role="group" aria-label="Reward type">
        <button class="reward-pill selected" data-val="default" onclick="selectReward(this)" aria-pressed="true">50/50<br>HBD+HP</button>
        <button class="reward-pill" data-val="sp" onclick="selectReward(this)" aria-pressed="false">100%<br>HP</button>
        <button class="reward-pill" data-val="decline" onclick="selectReward(this)" aria-pressed="false">Decline<br>rewards</button>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1; display:flex; flex-direction:column; justify-content:flex-end;">
      <div id="kc-notice">
        Hive Keychain not detected.<br>
        <a href="https://chrome.google.com/webstore/detail/hive-keychain/jcacnejopjdphbnjgfaaobbfafkihpep" target="_blank" rel="noopener">Install for Chrome ↗</a> ·
        <a href="https://addons.mozilla.org/en-US/firefox/addon/hive-keychain/" target="_blank" rel="noopener">Firefox ↗</a>
      </div>

      <button id="publish-btn" onclick="publish()" disabled aria-label="Publish post to Hive blockchain">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Publish to Hive
      </button>

      <div id="tx-info">
        <div>✓ Published successfully</div>
        <div style="margin-top:4px;">Tx: <span id="tx-id"></span></div>
        <div style="margin-top:4px;"><a id="tx-link" href="#" target="_blank" rel="noopener">View on Hive Explorer ↗</a></div>
      </div>
    </div>

  </div><!-- /sidebar -->

</div><!-- /main-wrap -->

<!-- Status bar -->
<div id="status-bar" role="status" aria-live="polite">
  <span id="word-count">0 words</span>
  <span id="char-count">0 chars</span>
</div>

<!-- Toast notification -->
<div id="toast" role="alert" aria-live="assertive"></div>

<script>
  /* ─────────────────────────────────────────────
     State
  ───────────────────────────────────────────── */
  var tags = [];
  var rewardType = 'default';
  var currentMode = 'write';
  var toastTimer = null;

  /* ─────────────────────────────────────────────
     Keychain detection
  ───────────────────────────────────────────── */
  function checkKeychain() {
    var dot    = document.getElementById('kc-dot');
    var lbl    = document.getElementById('kc-label');
    var btn    = document.getElementById('publish-btn');
    var notice = document.getElementById('kc-notice');

    if (typeof window.hive_keychain !== 'undefined') {
      dot.className = 'status-dot ok';
      lbl.textContent = 'Keychain connected';
      lbl.style.color = 'var(--hive-success)';
      btn.disabled = false;
      notice.style.display = 'none';
    } else {
      dot.className = 'status-dot err';
      lbl.textContent = 'Keychain not found';
      lbl.style.color = 'var(--hive-red)';
      btn.disabled = true;
      notice.style.display = 'block';
    }
  }

  /* Poll a few times after page load — Keychain injects asynchronously */
  setTimeout(checkKeychain, 500);
  setTimeout(checkKeychain, 1500);
  setTimeout(checkKeychain, 3000);

  /* ─────────────────────────────────────────────
     Write / Preview toggle
  ───────────────────────────────────────────── */
  function setMode(m) {
    currentMode = m;
    var edWrap  = document.getElementById('editor-wrap');
    var prev    = document.getElementById('preview-pane');
    var bw      = document.getElementById('btn-write');
    var bp      = document.getElementById('btn-preview');
    var tagsRow = document.getElementById('tags-row');

    if (m === 'write') {
      edWrap.style.display = 'flex';
      prev.style.display   = 'none';
      tagsRow.style.display = 'flex';
      bw.className = 'active'; bw.setAttribute('aria-pressed','true');
      bp.className = '';       bp.setAttribute('aria-pressed','false');
    } else {
      edWrap.style.display = 'none';
      prev.style.display   = 'block';
      tagsRow.style.display = 'none';
      bw.className = '';       bw.setAttribute('aria-pressed','false');
      bp.className = 'active'; bp.setAttribute('aria-pressed','true');
      renderPreview();
    }
  }

  /* ─────────────────────────────────────────────
     Markdown → HTML (lightweight parser)
  ───────────────────────────────────────────── */
  /* ── Security helpers ── */
  function sanitizeUrl(url) {
    /* Decode percent-encoding so javascript:%6a%61%76%61... is caught */
    var decoded;
    try { decoded = decodeURIComponent(url.trim()); } catch(e) { decoded = url.trim(); }
    /* Whitelist safe schemes only */
    if (/^(https?:|ipfs:|hive:)/i.test(decoded)) return escAttr(decoded);
    /* mailto is sometimes useful but not needed here — block everything else */
    return '#blocked';
  }

  function escAttr(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function markdownToHtml(raw) {
    // Escape HTML first
    var s = raw
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

    // Fenced code blocks — FIX: sanitize lang to alphanumeric+hyphen only
    s = s.replace(/```([a-z0-9-]*)\n([\s\S]*?)```/g, function(_, lang, code) {
      var safeLang = lang.replace(/[^a-z0-9-]/gi, '').substring(0, 32);
      return '<pre><code' + (safeLang ? ' class="language-' + safeLang + '"' : '') + '>' + code + '</code></pre>';
    });

    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headings
    s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

    // Bold & italic (order matters)
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');
    s = s.replace(/~~(.+?)~~/g,         '<s>$1</s>');

    // Blockquote
    s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

    // HR
    s = s.replace(/^---$/gm, '<hr>');

    // Unordered list items → wrap in <ul>
    s = s.replace(/((?:^- .+$\n?)+)/gm, function(block) {
      var items = block.trim().split('\n').map(function(l) {
        return '<li>' + l.replace(/^- /, '') + '</li>';
      }).join('');
      return '<ul>' + items + '</ul>\n';
    });

    // Ordered list items → wrap in <ol>
    s = s.replace(/((?:^\d+\. .+$\n?)+)/gm, function(block) {
      var items = block.trim().split('\n').map(function(l) {
        return '<li>' + l.replace(/^\d+\. /, '') + '</li>';
      }).join('');
      return '<ol>' + items + '</ol>\n';
    });

    // Images before links — FIX: sanitize src URL and alt attribute
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, url) {
      var safeUrl = sanitizeUrl(url);
      var safeAlt = escAttr(alt);
      return '<img src="' + safeUrl + '" alt="' + safeAlt + '">';
    });

    // Links — FIX: sanitize href URL, block javascript: and data: schemes
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url) {
      var safeUrl = sanitizeUrl(url);
      return '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
    });

    // Paragraphs — wrap lines not already wrapped in a block element
    var lines = s.split('\n');
    var out = [];
    var inPara = false;
    var blockTags = /^<(h[1-6]|ul|ol|li|blockquote|pre|hr|img)/;

    lines.forEach(function(line) {
      if (blockTags.test(line) || line.trim() === '') {
        if (inPara) { out.push('</p>'); inPara = false; }
        if (line.trim() !== '') out.push(line);
      } else {
        if (!inPara) { out.push('<p>'); inPara = true; }
        out.push(line);
      }
    });
    if (inPara) out.push('</p>');

    return out.join('\n');
  }

  function renderPreview() {
    var title = document.getElementById('title-input').value || '<em>Untitled</em>';
    var body  = document.getElementById('editor-area').value || '';
    document.getElementById('preview-pane').innerHTML =
      '<h1>' + title.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</h1>' +
      markdownToHtml(body);
  }

  /* ─────────────────────────────────────────────
     Toolbar helpers
  ───────────────────────────────────────────── */
  function getTA() { return document.getElementById('editor-area'); }

  function wrap(pre, post) {
    var ta = getTA();
    var s = ta.selectionStart, e = ta.selectionEnd;
    var sel = ta.value.substring(s, e) || 'text';
    ta.value = ta.value.substring(0,s) + pre + sel + post + ta.value.substring(e);
    ta.focus();
    ta.selectionStart = s + pre.length;
    ta.selectionEnd   = s + pre.length + sel.length;
    updateCounts();
  }

  function insertLine(prefix) {
    var ta     = getTA();
    var pos    = ta.selectionStart;
    var before = ta.value.substring(0, pos);
    var after  = ta.value.substring(pos);
    var nl     = (before.length > 0 && !before.endsWith('\n')) ? '\n' : '';
    ta.value   = before + nl + prefix + after;
    var np     = pos + nl.length + prefix.length;
    ta.focus();
    ta.selectionStart = ta.selectionEnd = np;
    updateCounts();
  }

  function insertLink() {
    var ta  = getTA();
    var s   = ta.selectionStart, e = ta.selectionEnd;
    var sel = ta.value.substring(s, e) || 'link text';
    var ins = '[' + sel + '](https://)';
    ta.value = ta.value.substring(0,s) + ins + ta.value.substring(e);
    ta.focus();
    // Place cursor inside the URL parens
    ta.selectionStart = s + sel.length + 3;
    ta.selectionEnd   = s + ins.length - 1;
    updateCounts();
  }

  function insertImage() {
    var url = prompt('Image URL:');
    if (!url) return;
    var alt = prompt('Alt text (optional):') || '';
    insertLine('!['+ alt +'](' + url + ')\n');
  }

  function insertCodeBlock() {
    var ta  = getTA();
    var s   = ta.selectionStart, e = ta.selectionEnd;
    var sel = ta.value.substring(s, e) || '';
    var ins = '```\n' + sel + '\n```';
    ta.value = ta.value.substring(0,s) + ins + ta.value.substring(e);
    ta.focus();
    ta.selectionStart = s + 4;
    ta.selectionEnd   = s + 4 + sel.length;
    updateCounts();
  }

  /* Keyboard shortcuts */
  document.getElementById('editor-area').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); wrap('**','**'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); wrap('*','*'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); insertLink(); }
  });

  /* ─────────────────────────────────────────────
     Reward selector
  ───────────────────────────────────────────── */
  function selectReward(el) {
    document.querySelectorAll('.reward-pill').forEach(function(b) {
      b.className = 'reward-pill';
      b.setAttribute('aria-pressed','false');
    });
    el.className = 'reward-pill selected';
    el.setAttribute('aria-pressed','true');
    rewardType = el.getAttribute('data-val');
  }

  /* ─────────────────────────────────────────────
     Tag manager
  ───────────────────────────────────────────── */
  var tagInput = document.getElementById('tag-input');

  tagInput.addEventListener('keydown', function(e) {
    if ((e.key === 'Enter' || e.key === ',') && this.value.trim()) {
      e.preventDefault();
      /* FIX: split on commas so "tag1, tag2" adds two tags instead of merging into one */
      var segments = this.value.split(',');
      segments.forEach(function(seg) {
        var t = seg.trim().toLowerCase().replace(/\s+/g, '-');
        if (t) addTag(t);
      });
      this.value = '';
    } else if (e.key === 'Backspace' && this.value === '' && tags.length > 0) {
      removeTag(tags.length - 1);
    }
  });

  function addTag(t) {
    t = t.replace(/[^a-z0-9-]/g,'');
    if (!t || tags.includes(t)) return;
    if (tags.length >= 8) { toast('Maximum 8 tags', 'error'); return; }
    tags.push(t);
    renderTags();
  }

  function removeTag(i) {
    tags.splice(i, 1);
    renderTags();
  }

  function renderTags() {
    var c = document.getElementById('tags-container');
    c.innerHTML = '';
    tags.forEach(function(t, i) {
      var pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.setAttribute('role','listitem');
      pill.innerHTML = '#' + t +
        '<button onclick="removeTag(' + i + ')" aria-label="Remove tag ' + t + '">×</button>';
      c.appendChild(pill);
    });
  }

  /* ─────────────────────────────────────────────
     Word / char counts
  ───────────────────────────────────────────── */
  function updateCounts() {
    var body  = document.getElementById('editor-area').value;
    var words = body.trim() === '' ? 0 : body.trim().split(/\s+/).length;
    document.getElementById('word-count').textContent = words + ' words';
    document.getElementById('char-count').textContent = body.length + ' chars';
  }

  document.getElementById('editor-area').addEventListener('input', updateCounts);
  document.getElementById('title-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  });

  /* ─────────────────────────────────────────────
     Toast
  ───────────────────────────────────────────── */
  function toast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.className = ''; }, 4000);
  }

  /* ─────────────────────────────────────────────
     Slugify
  ───────────────────────────────────────────── */
  function slugify(text) {
    return text
      .toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .substring(0, 255);
  }

  /* ─────────────────────────────────────────────
     Publish
  ───────────────────────────────────────────── */
  function publish() {
    /* Re-check keychain */
    checkKeychain();

    var username    = document.getElementById('username').value.trim().replace(/^@/, '');
    var title       = document.getElementById('title-input').value.trim();
    var body        = document.getElementById('editor-area').value.trim();
    var community   = document.getElementById('community').value;
    var beneficiary = document.getElementById('beneficiary').value.trim();

    /* Auto-capture any tag still sitting in the input field */
    var pendingTag = document.getElementById('tag-input').value.trim();
    if (pendingTag) {
      addTag(pendingTag.replace(/,+/g,'').toLowerCase().replace(/\s+/g,'-'));
      document.getElementById('tag-input').value = '';
    }

    /* Validation */
    if (!username)          { toast('Enter your Hive username', 'error'); return; }
    if (!title)             { toast('Add a title before publishing', 'error'); return; }
    if (body.length < 10)   { toast('Post body is too short', 'error'); return; }
    if (tags.length === 0)  { toast('Add at least one tag', 'error'); return; }
    if (tags.length > 8)    { toast('Maximum 8 tags allowed', 'error'); return; }

    if (typeof window.hive_keychain === 'undefined') {
      toast('Hive Keychain extension not found', 'error');
      return;
    }

    /* Build permlink */
    var permlink     = slugify(title) + '-' + Date.now().toString(36);
    var parentAuthor = '';
    var parentPermlink = community ? community : tags[0];

    /* JSON metadata */
    var jsonMeta = JSON.stringify({
      tags:   tags,
      app:    'hivewrite/1.0',
      format: 'markdown'
    });

    /* comment_options — always build from current reward selection so
       percent_hbd is always correct, even when a beneficiary is added */
    var percentHbd = 10000; /* default 50/50 — Hive uses 5000 for 50% HBD */
    if (rewardType === 'default') percentHbd = 5000;  /* FIX: was incorrectly 10000 */
    if (rewardType === 'sp')      percentHbd = 0;
    if (rewardType === 'decline') percentHbd = 10000; /* irrelevant — payout set to 0 */

    var maxPayout = rewardType === 'decline' ? '0.000 HBD' : '1000000.000 HBD';

    /* Start with null — only create comment_options if we actually need it */
    var commentOptions = null;

    /* We always need comment_options when reward type is not default OR beneficiary is set */
    /* Beneficiary — weight is 1-10000 where 10000=100%, so user enters 25 for 25% */
    var bAcc = null;
    var bPct = 0;

    if (beneficiary) {
      var parts = beneficiary.split(':');
      if (parts.length === 2) {
        bAcc = parts[0].trim().replace(/^@/, '');
        bPct = Math.round(parseFloat(parts[1]) * 100); /* 25 -> 2500 */
        if (!bAcc) {
          toast('Beneficiary account name is missing', 'error'); return;
        }
        if (isNaN(bPct) || bPct <= 0) {
          toast('Beneficiary percentage must be greater than 0', 'error'); return;
        }
        if (bPct > 10000) {
          toast('Beneficiary percentage cannot exceed 100%', 'error'); return;
        }
      } else {
        toast('Beneficiary format: account:percent  e.g. alice:25', 'error'); return;
      }
    }

    /* Build comment_options whenever reward type is non-default or a beneficiary is set */
    if (rewardType !== 'default' || bAcc) {
      commentOptions = {
        author: username,
        permlink: permlink,
        max_accepted_payout: maxPayout,
        percent_hbd: percentHbd,
        allow_votes: true,
        allow_curation_rewards: true,
        extensions: bAcc ? [[0, { beneficiaries: [{ account: bAcc, weight: bPct }] }]] : []
      };
    }

    /* Build operations array */
    var operations = [
      ['comment', {
        parent_author:   parentAuthor,
        parent_permlink: parentPermlink,
        author:          username,
        permlink:        permlink,
        title:           title,
        body:            body,
        json_metadata:   jsonMeta
      }]
    ];

    if (commentOptions) {
      operations.push(['comment_options', commentOptions]);
    }

    /* UI: loading state */
    var btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.innerHTML =
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
      '<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>' +
      '</svg> Signing…';

    /* Broadcast via Keychain */
    window.hive_keychain.requestBroadcast(
      username,
      operations,
      'posting',
      function(response) {
        /* Restore button */
        btn.disabled = false;
        btn.innerHTML =
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>' +
          '</svg> Publish to Hive';

        if (response.success) {
          var txId = (response.result && response.result.id) ? response.result.id : '';
          var txInfo = document.getElementById('tx-info');
          var txIdEl = document.getElementById('tx-id');
          var txLink = document.getElementById('tx-link');

          if (txId) {
            txIdEl.textContent = txId.substring(0,20) + '…';
            txLink.href = 'https://hiveblocks.com/tx/' + txId;
          }

          txInfo.style.display = 'block';
          toast('✓ Published!  @' + username + '/' + permlink, 'success');
        } else {
          var errMsg = response.message || response.error || 'Transaction rejected';
          toast('Error: ' + errMsg, 'error');
          console.error('[HiveWrite] Broadcast error:', response);
        }
      }
    );
  }
</script>
</body>
</html>
